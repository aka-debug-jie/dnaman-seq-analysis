[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dnaman-seq-analysis"
dynamic = ["version"]
description = "Drive DNAMAN 4.0 (legacy Windows GUI) from Python: restriction analysis, primer design, ORF, assembly, alignment and protein tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aka-debug-jie", email = "aka-debug-jie@users.noreply.github.com" }]
keywords = ["dnaman", "bioinformatics", "automation", "win32", "pywinauto", "molecular-biology", "restriction-analysis", "primer-design"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "Pillow>=9.0",
    "biopython>=1.80",
    "openpyxl>=3.1",
    # The Win32 stack only exists on Windows. Keeping it behind a marker lets the
    # package install anywhere, so the platform-free modules (commands, config,
    # report, seqmath) stay importable off Windows while the GUI modules raise a
    # descriptive ImportError when they are actually used.
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=300; sys_platform == 'win32'",
]

[project.optional-dependencies]
cloning = ["pydna>=5.5", "primer3-py>=2.0"]
viz = ["pycirclize>=1.0", "matplotlib>=3.5"]
reports = ["python-docx>=1.0"]
all = ["pydna>=5.5", "primer3-py>=2.0", "pycirclize>=1.0", "matplotlib>=3.5", "python-docx>=1.0"]

[project.urls]
Homepage = "https://github.com/aka-debug-jie/dnaman-seq-analysis"
Repository = "https://github.com/aka-debug-jie/dnaman-seq-analysis"
Issues = "https://github.com/aka-debug-jie/dnaman-seq-analysis/issues"

[project.scripts]
dnaman = "dnaman.cli:main"

[tool.setuptools]
packages = ["dnaman"]

[tool.setuptools.dynamic]
version = { attr = "dnaman._version.__version__" }
